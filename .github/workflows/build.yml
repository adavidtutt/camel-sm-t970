name: Build CAMEL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - initramfs/**
      - rootfs-overlay/**
      - scripts/build-rootfs.sh
      - scripts/build-recovery.sh
      - scripts/verify-release.sh
      - sources.lock
      - .github/workflows/build.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rootfs:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      CAMEL_INCLUDE_UI: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap e2fsprogs \
            cpio lz4 git python3
      - name: Build rootfs
        run: |
          sudo --preserve-env=GITHUB_WORKSPACE,CAMEL_INCLUDE_UI \
            scripts/build-rootfs.sh
          (cd out && sha256sum -c rootfs-a.ext4.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: camel-rootfs
          path: |
            out/rootfs-a.ext4
            out/rootfs-a.ext4.sha256
          compression-level: 1

  recovery:
    needs: rootfs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: camel-rootfs
          path: out
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio lz4 git python3 openssl
      - name: Mount rootfs
        run: |
          mkdir -p build/rootfs-mounted
          sudo mount -o loop,ro out/rootfs-a.ext4 build/rootfs-mounted
      - name: Build recovery
        run: |
          sudo --preserve-env=GITHUB_WORKSPACE scripts/build-recovery.sh
          (cd out && sha256sum -c camel-recovery.img.sha256)
          (cd out && sha256sum -c AP_CAMEL_RECOVERY.tar.md5.sha256)
      - name: Unmount rootfs
        if: always()
        run: sudo umount build/rootfs-mounted || true
      - uses: actions/upload-artifact@v4
        with:
          name: camel-recovery
          path: |
            out/camel-recovery.img
            out/camel-recovery.img.sha256
            out/camel-recovery.img.avb.txt
            out/AP_CAMEL_RECOVERY.tar.md5
            out/AP_CAMEL_RECOVERY.tar.md5.sha256
