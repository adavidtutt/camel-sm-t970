name: Build CAMEL kernel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - configs/**
      - kernel-patches/**
      - scripts/build-kernel.sh
      - scripts/configure-kernel.sh
      - .github/workflows/kernel.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential clang flex gcc-aarch64-linux-gnu \
            git libelf-dev libssl-dev lld llvm python3 rsync
      - name: Build pinned SM-T970 kernel
        run: scripts/build-kernel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: camel-kernel
          path: out/kernel
          compression-level: 1
